
{% extends "base.html" %}

{% block title %}Edit Employee | RMS{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Employee</h1>
    <p>Update employee details and assigned role.</p>
</div>

<div class="card">
    <form method="POST"
          action="{{ url_for('edit_user', user_id=user.user_id) }}">

        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name"
               value="{{ user.full_name }}" maxlength="100" required>

        <label for="email">Company Email</label>
        <input type="email" id="email" name="email"
               value="{{ user.email }}" maxlength="150" required>

        <label for="role">Assigned Role</label>
        <select id="role" name="role" required>
            {% for item in roles %}
            <option value="{{ item }}"
                {% if user.role == item %}selected{% endif %}>
                {{ item.replace('_', ' ').title() }}
            </option>
            {% endfor %}
        </select>

        <button type="submit">Save Changes</button>
        <a href="{{ url_for('manage_users') }}">Cancel</a>
    </form>
</div>
{% endblock %}
